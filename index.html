<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Unofficial Champions League 2026/27 fan app: table, fixtures, match stats, line-ups, player minutes, previews, news and a fantasy league to play with friends.">
<meta name="theme-color" content="#0a1030">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<title>Midweek Lights</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0a1030; --bg-2:#0c1336; --surface:#121a42; --surface-2:#18225a; --line:#26306a; --line-soft:#1a2352;
  --fg:#eef1fb; --muted:#9aa3c7; --faint:#6c76a6;
  --accent:#ffd166; --accent-ink:#1d1500; --accent-2:#7fb3ff;
  --win:#3ecf8e; --draw:#c7cbe0; --loss:#ff6b6b; --pill-ink:#08122e;
  --zone-r16:#3ecf8e; --zone-po:#ffb547; --zone-out:#4b5488;
  --pitch:#0f3b2c; --pitch-2:#124633; --pitch-line:rgba(235,245,255,.30); --pitch-ink:#ffffff; --pitch-tag:rgba(4,10,32,.78);
  --scrim:rgba(3,6,22,.62); --shadow:0 18px 50px rgba(0,0,0,.45);
  --beam:rgba(255,226,150,.10);
  --ff-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --ff-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ff-data:"Barlow Semi Condensed","Barlow","Arial Narrow",system-ui,sans-serif;
  --tabbar-h:64px; --crest-edge:rgba(255,255,255,.55);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light; --crest-edge:transparent;
    --bg:#f3f5fb; --bg-2:#eaeef8; --surface:#ffffff; --surface-2:#eef1f9; --line:#d6dcee; --line-soft:#e6eaf5;
    --fg:#0d1433; --muted:#54608c; --faint:#8790b3;
    --accent:#b77900; --accent-ink:#ffffff; --accent-2:#2a64c9;
    --win:#15935c; --draw:#7d849f; --loss:#d23f3f; --pill-ink:#ffffff;
    --zone-r16:#15935c; --zone-po:#d48806; --zone-out:#b3bad3;
    --pitch:#2f7d50; --pitch-2:#358a59; --pitch-line:rgba(255,255,255,.62); --pitch-ink:#ffffff; --pitch-tag:rgba(8,24,18,.72);
    --scrim:rgba(13,20,51,.38); --shadow:0 18px 50px rgba(13,20,51,.18);
    --beam:rgba(183,121,0,.07);
  }
}
:root[data-theme="light"]{
  color-scheme: light; --crest-edge:transparent;
  --bg:#f3f5fb; --bg-2:#eaeef8; --surface:#ffffff; --surface-2:#eef1f9; --line:#d6dcee; --line-soft:#e6eaf5;
  --fg:#0d1433; --muted:#54608c; --faint:#8790b3;
  --accent:#b77900; --accent-ink:#ffffff; --accent-2:#2a64c9;
  --win:#15935c; --draw:#7d849f; --loss:#d23f3f; --pill-ink:#ffffff;
  --zone-r16:#15935c; --zone-po:#d48806; --zone-out:#b3bad3;
  --pitch:#2f7d50; --pitch-2:#358a59; --pitch-line:rgba(255,255,255,.62); --pitch-ink:#ffffff; --pitch-tag:rgba(8,24,18,.72);
  --scrim:rgba(13,20,51,.38); --shadow:0 18px 50px rgba(13,20,51,.18);
  --beam:rgba(183,121,0,.07);
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--ff-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:80;pointer-events:none}
a{color:var(--accent-2)}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.num,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto;width:100%}
.col{min-width:0}
.app-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.hdr{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);min-width:0}
.mark{display:grid;grid-template-columns:repeat(3,5px);gap:2px;padding:3px;border:1.5px solid var(--accent);border-radius:3px}
.mark i{width:5px;height:5px;background:var(--accent);border-radius:50%;display:block}
.brand b{font:800 22px/1 var(--ff-display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.hdr-meta{margin-left:auto;font:600 12px/1.2 var(--ff-data);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;white-space:nowrap}
.auth-btn{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:700 13px/1 var(--ff-data);letter-spacing:.04em;cursor:pointer;flex:none;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.app-header:has(#auth-btn:not([hidden])) .hdr-meta{display:none}}
.auth-btn.in{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:40px;padding:0;border-radius:50%;font-size:16px}
.auth{display:flex;flex-direction:column;gap:12px;max-width:440px}
.auth label{font:700 12px/1 var(--ff-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.auth p{margin:0;line-height:1.5}
.btn.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #747775;font-weight:600}
.btn.g-btn:hover{background:#f2f2f2}
.auth .or{text-align:center;color:var(--muted);font:600 12px/1 var(--ff-data);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:20px;height:20px}

main.wrap{padding-block:18px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom,0px))}
.view{display:block}
.view-title{font:800 34px/1 var(--ff-display);text-transform:uppercase;letter-spacing:.02em;margin:4px 0 14px}
.view-sub{color:var(--muted);margin:-8px 0 16px;font-size:15px}

/* tabbar / rail */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .nav-brand{display:none}
.nav ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar-h)}
.nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;color:var(--muted);text-decoration:none;font:600 11px/1 var(--ff-data);letter-spacing:.05em;text-transform:uppercase}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--accent)}
.nav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.nav .dot{position:absolute;top:10px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}

@media (min-width:900px){
  .nav{top:0;right:auto;width:224px;border-top:0;border-right:1px solid var(--line);padding:max(20px,env(safe-area-inset-top,0px)) 14px 20px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;background:var(--bg-2)}
  .nav .nav-brand{display:flex;padding:6px 8px 26px}
  .nav ul{display:flex;flex-direction:column;height:auto;gap:4px}
  .nav a{flex-direction:row;justify-content:flex-start;gap:12px;height:46px;padding:0 12px;border-radius:8px;font:600 15px/1 var(--ff-body);letter-spacing:.01em;text-transform:none}
  .nav a:hover{background:var(--surface);color:var(--fg)}
  .nav a[aria-current="page"]{background:var(--surface);color:var(--fg)}
  .nav a[aria-current="page"]::before{top:10px;bottom:10px;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .nav a[aria-current="page"] svg{color:var(--accent)}
  .nav .dot{top:50%;right:12px;margin-top:-4px}
  .nav-foot{margin-top:auto;padding:0 10px;color:var(--faint);font-size:12px;line-height:1.4}
  .col{margin-left:224px}
  .app-header .brand{display:none}
  main.wrap{padding-bottom:40px}
  :root{--tabbar-h:0px}
}
.nav-foot{display:none}
@media (min-width:900px){.nav-foot{display:block}}

/* ---------- common ---------- */
.sec{margin:28px 0 0}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.sec-h h2{font:800 20px/1 var(--ff-display);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line);order:2}
.sec-h .more{order:3;font:600 13px/1 var(--ff-data);letter-spacing:.04em;text-transform:uppercase;color:var(--accent-2);text-decoration:none;white-space:nowrap;background:none;border:0;cursor:pointer;padding:6px 0}
.linkbtn{font:600 13px/1 var(--ff-data);letter-spacing:.04em;text-transform:uppercase;color:var(--accent-2);background:none;border:0;cursor:pointer;padding:6px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.kicker{font:700 12px/1 var(--ff-data);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.crest{display:inline-block;flex:none;width:28px;height:32px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.28))}
.crest svg{display:block;overflow:visible}
.crest.img{height:auto;aspect-ratio:1;filter:drop-shadow(0 0 .6px var(--crest-edge)) drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}
.crest img,.shirt.img img{display:block;width:100%;height:100%;object-fit:contain}
.slot .shirt.badge.img{display:block;width:40px;height:40px;overflow:visible}
.crest.img img,.slot .shirt.img img{max-width:100%;max-height:100%}
@media (min-width:480px){.slot .shirt.badge.img{width:44px;height:44px}}
.crest.sm{width:22px;height:25px}
.crest.lg{width:56px;height:64px}
.crest.xl{width:72px;height:83px}
.fp{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:4px;font:700 11px/1 var(--ff-data);color:var(--pill-ink)}
.fp.W{background:var(--win)} .fp.D{background:var(--draw)} .fp.L{background:var(--loss)}
.form{display:inline-flex;gap:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px/1 var(--ff-body);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--loss)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.primary:disabled{background:var(--surface);color:var(--muted);border-color:var(--line);opacity:1}
.btn svg{width:18px;height:18px}
.seg{display:inline-flex;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:9px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;color:var(--muted);min-height:38px;padding:0 16px;border-radius:7px;font:700 14px/1 var(--ff-data);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;min-height:36px;padding:0 14px;font:600 14px/1 var(--ff-data);letter-spacing:.03em;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{font-weight:500;opacity:.7;margin-left:4px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font:700 12px/1 var(--ff-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.input,.select{width:100%;min-height:44px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:0 12px;font:500 16px/1.2 var(--ff-body)}
.input::placeholder{color:var(--faint)}
.input:focus,.select:focus{border-color:var(--accent-2);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-2) 25%,transparent)}
.select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--faint);pointer-events:none}
.search .input{padding-left:38px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font:800 20px/1.1 var(--ff-display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--accent-2);border-radius:8px;background:var(--surface);font-size:14px;color:var(--muted);margin:0 0 14px}
.banner b{color:var(--fg);font-weight:600}
.banner.warn{border-left-color:var(--loss)}
.banner.warn b{color:var(--loss)}
.tag{display:inline-block;font:700 11px/1 var(--ff-data);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2)}
.pos-tag{display:inline-grid;place-items:center;min-width:34px;height:20px;padding:0 5px;border-radius:4px;font:700 11px/1 var(--ff-data);letter-spacing:.06em;border:1px solid var(--line);color:var(--muted)}
.skel{background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.4s infinite linear;border-radius:8px}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- home ---------- */
.home-grid{display:grid;gap:0}
.home-grid>*{min-width:0}
.hero{position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2),var(--surface) 70%);padding:18px 0 16px;isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;top:-40%;width:70%;height:170%;z-index:-1;pointer-events:none;background:conic-gradient(from 180deg at 50% 0%,transparent 0deg 160deg,var(--beam) 172deg 188deg,transparent 200deg 360deg)}
.hero::before{left:-22%;transform:rotate(-24deg)}
.hero::after{right:-22%;transform:rotate(24deg)}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 16px}
.hero-top h1{font:900 40px/.9 var(--ff-display);text-transform:uppercase;letter-spacing:.01em;margin-top:6px}
.hero-top .season{font:600 13px/1.2 var(--ff-data);color:var(--muted);text-align:right;letter-spacing:.04em}
.ticker-h{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px}
.ticker{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 6px;scroll-padding-inline:16px;scrollbar-width:none}
.ticker::-webkit-scrollbar,.scorers::-webkit-scrollbar,.lg-chips::-webkit-scrollbar{display:none}
.score-card{flex:none;width:156px;scroll-snap-align:start;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--fg)}
.score-card:hover{border-color:var(--muted)}
.sc-meta{display:flex;justify-content:space-between;font:600 11px/1 var(--ff-data);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.sc-row{display:flex;align-items:center;gap:8px;height:28px}
.sc-row .nm{flex:1;font:600 15px/1 var(--ff-data);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-row .g{font:800 24px/1 var(--ff-display);font-variant-numeric:tabular-nums}
.sc-row.lose{color:var(--muted)}
.next{margin:14px 16px 0;padding:14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;gap:12px}
.next-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.next-h .t{font:800 22px/1 var(--ff-display);text-transform:uppercase;letter-spacing:.03em}
.next-h .d{font:600 14px/1.2 var(--ff-data);color:var(--muted)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{text-align:center;padding:8px 0 6px;border-radius:8px;background:var(--surface)}
.cd b{display:block;font:800 36px/1 var(--ff-display);color:var(--accent);font-variant-numeric:tabular-nums}
.cd span{font:700 10px/1 var(--ff-data);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.cd-live{font:800 28px/1 var(--ff-display);color:var(--accent);text-transform:uppercase}
.next-fx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.next-fx::-webkit-scrollbar{display:none}
.mini-fx{flex:none}
.mini-fx{display:inline-flex;align-items:center;gap:4px;padding:4px 8px 4px 4px;border-radius:999px;background:var(--surface);font:600 12px/1 var(--ff-data);color:var(--muted)}
.mini-fx .v{color:var(--faint);margin:0 1px}

.mini-table{padding:4px 0}
.mt-row{display:grid;grid-template-columns:30px 28px 1fr 34px 40px 40px;align-items:center;gap:8px;min-height:42px;padding:0 12px;border:0;background:none;width:100%;text-align:left;color:var(--fg);cursor:pointer;border-left:3px solid transparent;font:500 15px/1.1 var(--ff-data)}
.mt-row:hover{background:var(--surface-2)}
.mt-row + .mt-row{border-top:1px solid var(--line-soft)}
.mt-row .pos{font:800 18px/1 var(--ff-display);color:var(--muted);text-align:center}
.mt-row .club{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mt-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.mt-row .pts{text-align:right;font:800 20px/1 var(--ff-display);color:var(--fg)}
.mt-head{display:grid;grid-template-columns:30px 28px 1fr 34px 40px 40px;gap:8px;padding:8px 12px 6px 15px;font:700 11px/1 var(--ff-data);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.mt-head span:nth-child(n+4){text-align:right}
.z-r16{border-left-color:var(--zone-r16)!important}
.z-po{border-left-color:var(--zone-po)!important}
.z-out{border-left-color:var(--zone-out)!important}

.scorers{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.scorer{flex:none;width:150px;scroll-snap-align:start;position:relative;overflow:hidden;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;color:var(--fg)}
.scorer:hover{border-color:var(--muted)}
.scorer .big{font:900 54px/.85 var(--ff-display);color:var(--accent);font-variant-numeric:tabular-nums}

  RIVALS = defs.map(d => {
    const rnd = mulberry(d.seed);
    let order = D.players.slice();
    if (d.sort) order.sort(d.sort); else { order = order.map(p => [rnd(), p]).sort((a, b) => a[0] - b[0]).map(x => x[1]); }
    const slots = buildSquad(order, d.formation), squad = slots.filter(Boolean);
    const cap = squad.slice().sort((a, b) => P.get(b).fp - P.get(a).fp)[0] || null;
    const predictions = {};
    ftShown.concat(nx).forEach(f => { predictions[f.id] = { h: Math.floor(rnd() * 3.4), a: Math.floor(rnd() * 2.8) }; });
    return { id: d.id, managerName: d.managerName, teamName: d.teamName, formation: d.formation, squad, captain: cap, leagues: ['DEMO42'], predictions, example: true };
  });
  return RIVALS;
}

        '<div class="sgrid" style="margin-top:12px;grid-template-columns:repeat(3,1fr)"><div class="stat hl"><b>' + md.best[0] + '–' + md.best[1] + '</b><span>Most likely score</span></div><div class="stat"><b>' + md.lh.toFixed(2) + '</b><span>' + esc(th.short) + ' expected goals</span></div><div class="stat"><b>' + md.la.toFixed(2) + '</b><span>' + esc(ta.short) + ' expected goals</span></div></div>' +
        '<p class="hint">Assumptions: a Poisson model using each club’s goals scored and conceded in this league phase, pulled toward the competition average because only ' + (H ? H.p : 0) + ' games have been played, plus a home advantage. A guide for your predictions, not betting advice.</p></div>';
    }
    const row = (lbl, a, b) => '<div class="cmp"><b>' + a + '</b><span>' + lbl + '</span><b>' + b + '</b></div>';
    const avg = (id, k) => { const fx = D.fixtures.filter(x => x.status === 'FT' && (x.home === id || x.away === id) && matchOf(x.id)); const v = fx.map(x => { const s = matchOf(x.id).stats || {}; return Array.isArray(s[k]) ? s[k][x.home === id ? 0 : 1] : null; }).filter(v => v != null); return v.length ? (v.reduce((a, b) => a + +b, 0) / v.length) : null; };
    if (H && A) {
      h += '<div class="sh-sec"><h3>Head to head this campaign</h3><div class="cmps">' + row('Position', ordinal(H.pos), ordinal(A.pos)) + row('Points', H.pts, A.pts) + row('Form', formPills(H.form, 5), formPills(A.form, 5)) + row('Goals scored', H.gf, A.gf) + row('Goals conceded', H.ga, A.ga);
      [['possession', 'Avg possession', '%', 0], ['shots', 'Avg shots', '', 1], ['xg', 'Avg xG', '', 2]].forEach(([k, l, u, d]) => { const a = avg(f.home, k), b = avg(f.away, k); if (a != null && b != null) h += row(l, a.toFixed(d) + u, b.toFixed(d) + u); });
      h += '</div></div>';
    }
    const key = id => D.players.filter(p => p.teamId === id).sort((a, b) => b.fp - a.fp).slice(0, 3);
    h += '<div class="sh-sec"><h3>Players to watch</h3><div class="mt-grid">' + [f.home, f.away].map(id => '<div><div class="mt-cap">' + crest(id, 'sm') + '<b>' + esc(T.get(id).name) + '</b></div>' + key(id).map(p => '<button class="sq-row" type="button" data-act="player" data-id="' + esc(p.id) + '" data-push="1"><span class="pos-tag">' + p.pos + '</span><span class="nm">' + esc(p.name) + '</span><span class="v">' + p.goals + 'G</span><span class="v">' + p.assists + 'A</span><span class="v on">' + p.fp + '</span></button>').join('') + '</div>').join('') + '</div></div>';
    h += '<div class="sh-sec"><a class="btn primary block" href="#fantasy" data-act="ftab" data-tab="pred">Predict this score</a></div>';
    return { title: 'Preview', html: h };
  }
});

/* ================= events ================= */
function goFantasy(tab){ S.ftab = tab; store.set('ml.ftab', tab); if (S.route !== 'fantasy') location.hash = '#fantasy'; else renderFantasy(); }
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  const act = a.dataset.act, id = a.dataset.id;
  switch (act) {
    case 'club': if (a.tagName === 'TR' && e.target.closest('button')) return; openSheet('club', id, !$('#sheet').hidden); break;
    case 'player': openSheet('player', id, !!a.dataset.push && !$('#sheet').hidden); break;
    case 'match': openSheet('match', id, !!a.dataset.push && !$('#sheet').hidden); break;
    case 'auth': if (S.sb) openSheet('auth'); break;
    case 'auth-google': { a.disabled = true; const m = $('#auth-gmsg');
      S.sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } }).then(r => { if (r && r.error) throw r.error; }).catch(err => { a.disabled = false; if (m) m.textContent = /not enabled|unsupported provider/i.test(String(err && err.message)) ? 'Google sign-in isn’t switched on yet. Try again soon.' : 'Couldn’t start Google sign-in: ' + (err && err.message || 'unknown error'); });
      break; }
    case 'auth-out': a.disabled = true; a.textContent = 'Signing out…'; S.sb.auth.signOut().finally(() => location.reload()); break;
    case 'goto-fixtures': S.tableTab = 'fixtures'; S.fxMd = +a.dataset.md; store.set('ml.tableTab', 'fixtures'); if (S.route === 'table') renderTable(); else location.hash = '#table'; break;
    case 'table-tab': S.tableTab = a.dataset.tab; store.set('ml.tableTab', S.tableTab); renderTable(); break;
    case 'md': S.fxMd = +a.dataset.md; renderTable(); break;
    case 'ppos': S.pf.pos = a.dataset.pos; S.pf.limit = 80; renderPlayerList(); break;
    case 'pmore': S.pf.limit = 1e6; renderPlayerList(); break;
    case 'players-sort': S.pf.sort = a.dataset.sort; break;
    case 'ntag': S.newsTag = a.dataset.tag; renderNews(); break;
    case 'ftab': e.preventDefault(); if (!$('#sheet').hidden) closeSheet(); goFantasy(a.dataset.tab); break;
    case 'slot': { const i = +a.dataset.i; S.picker = { q: '', sort: 'fp', club: '' }; openSheet(S.draft.slots[i] ? 'slot' : 'picker', i); break; }
    case 'pick': { const i = +a.dataset.i; const p = P.get(id); if (!p || pickBlock(p, i)) return; setSlot(i, id); closeSheet(); rerenderXI(); toast(surname(p.name) + ' in — ' + (11 - squadOf().length ? (11 - squadOf().length) + ' to go' : 'XI complete, don’t forget to save')); break; }
    case 'replace': S.picker = { q: '', sort: 'fp', club: '' }; openSheet('picker', +a.dataset.i, true); break;
    case 'captain': { const i = +a.dataset.i, pid = S.draft.slots[i]; S.draft.captain = S.draft.captain === pid ? null : pid; closeSheet(); rerenderXI(); toast(S.draft.captain ? surname(P.get(pid).name) + ' is your captain' : 'Captaincy removed'); break; }
    case 'remove-slot': { const i = +a.dataset.i; setSlot(i, null); closeSheet(); rerenderXI(); break; }
    case 'add-xi': addFromSheet(id); break;
    case 'save-team': saveTeam(); break;
    case 'autofill': autoFill(); break;
    case 'clear-xi': clearXI(a); break;
    case 'sel-league': S.selLeague = a.dataset.code; store.set('ml.selLeague', S.selLeague); $$('.lg-chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.code === S.selLeague))); ensureSub(S.selLeague); renderBoard(); break;
    case 'copy-invite': copyInvite(a.dataset.code, a); break;
    case 'leave-league': leaveLeague(a.dataset.code, a); break;
    case 'retry-board': ensureSub(S.selLeague, true); renderBoard(); break;
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act]')) { e.preventDefault(); e.target.click(); } });

/* ================= routing ================= */
const ROUTES = ['home', 'table', 'players', 'news', 'fantasy'];
function onHash(){
  const h = (location.hash || '').replace(/^#/, '');
  const m = /^join-([A-Za-z0-9]{6})$/.exec(h);
  if (m) {
    S.joinPrefill = m[1].toUpperCase(); S.ftab = 'leagues'; setLeagueMsg('join', 'ok', 'Code ' + S.joinPrefill + ' filled in from your invite link — tap Join.');
    try { history.replaceState(null, '', '#fantasy'); } catch (e) {}
    show('fantasy'); return;
  }
  show(ROUTES.includes(h) ? h : 'home');
}
function show(r){
  const changed = S.route !== r; S.route = r;
  ROUTES.forEach(x => { $('#view-' + x).hidden = x !== r; });
  $$('.nav a[data-route]').forEach(a => { if (a.dataset.route === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (!$('#sheet').hidden) closeSheet();
  renderRoute();
  if (changed) window.scrollTo(0, 0);
}
function renderRoute(){
  if (!D) return;
  ({ home: renderHome, table: renderTable, players: renderPlayers, news: renderNews, fantasy: renderFantasy })[S.route]();
}
function updateHomeFan(){ const el = $('#home-fan'); if (el && S.route === 'home') el.innerHTML = fanCard(); }
window.addEventListener('hashchange', onHash);

/* ================= Supabase backend (public website build) ================= */
function sbAdapter(sb){
  const doc = path => { const i = path.indexOf('/'), col = path.slice(0, i), id = path.slice(i + 1);
    return {
      async get(){
        const r = col === 'entries' ? await sb.from('entries').select('data').eq('user_id', id).maybeSingle() : await sb.from('leagues').select('code,name,created_by,created_at').eq('code', id).maybeSingle();
        if (r.error) throw r.error;
        if (!r.data) return { exists: false, data: () => undefined };
        const body = col === 'entries' ? r.data.data : { name: r.data.name, code: r.data.code, createdBy: r.data.created_by, createdAt: r.data.created_at };
        return { exists: true, data: () => body };
      },
      async set(body){
        const r = col === 'entries'
          ? await sb.from('entries').upsert({ user_id: id, leagues: (body.leagues || []).slice(0, 20), data: body, updated_at: new Date().toISOString() })
          : await sb.from('leagues').insert({ code: id, name: String(body.name || '').slice(0, 60) });
        if (r.error) throw r.error;
      }
    }; };
  return { doc, collection(){ return { where(field, op, val){ return { onSnapshot(next, err){
    let alive = true, busy = false;
    const load = async () => { if (busy) return; busy = true;
      try { const r = await sb.from('entries').select('user_id,data').contains('leagues', [val]);
        if (!alive) return; if (r.error) { err && err({ code: 'unavailable', message: r.error.message }); return; }
        next({ docs: r.data.map(x => ({ id: x.user_id, exists: true, data: () => x.data })), metadata: { fromCache: false } });
      } finally { busy = false; } };
    load();
    const ch = sb.channel('lb-' + val + '-' + Math.random().toString(36).slice(2)).on('postgres_changes', { event: '*', schema: 'public', table: 'entries' }, () => load()).subscribe();
    const t = setInterval(() => { if (!document.hidden) load(); }, 60000);
    return () => { alive = false; clearInterval(t); try { sb.removeChannel(ch); } catch (e) {} };
  } }; } }; } };
}
function updateAuthBtn(){
  const b = $('#auth-btn'); if (!b) return; const u = S.authUser;
  b.classList.toggle('in', !!u); b.textContent = u ? (u.email || '?').charAt(0).toUpperCase() : 'Sign in';
  b.setAttribute('aria-label', u ? 'Account: ' + (u.email || '') : 'Sign in'); b.title = u ? 'Signed in as ' + (u.email || '') : 'Sign in to play fantasy with friends';
}
async function initSupabase(){
  const cfg = window.ML_SUPABASE; let sb = null, session = null;
  try { sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } }); } catch (e) { console.error(e); }
  S.sb = sb; $('#auth-btn').hidden = !sb;
  if (sb) {
    try { const r = await withTimeout(sb.auth.getSession(), 8000); session = r && r.data && r.data.session || null; } catch (e) {}
    sb.auth.onAuthStateChange((ev, s) => { if (!S.authReady) return; const now = s && s.user ? s.user.id : null; if ((S.authUser ? S.authUser.id : null) !== now) location.reload(); });
  }
  if (/access_token=|error_description=/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search + '#fantasy'); } catch (e) {} onHash(); }
  S.authUser = session && session.user || null; updateAuthBtn();
  const local = sanitizeEntry(store.get('ml.entry', null));
  if (sb && S.authUser) {
    S.mode = 'mp'; S.uid = S.authUser.id; S.db = sbAdapter(sb); S.user = { id: async () => S.uid, profiles: async () => ({}) };
    try {
      const snap = await withTimeout(S.db.doc('entries/' + S.uid).get(), 10000);
      if (snap && snap.exists) S.saved = sanitizeEntry(snap.data());
      else if (local.squad.length) { const up = Object.assign({}, local, { leagues: [] }); await S.db.doc('entries/' + S.uid).set(up); S.saved = sanitizeEntry(up); toast('Your team is now saved to your account'); }
    } catch (e) { console.error(e); }
  } else { S.mode = 'local'; S.saved = local; }
  S.authReady = true;
  draftFromSaved();
  await loadLeagueNames().catch(() => {});
  refreshSaveState();
  if (S.route === 'fantasy') renderFantasy(); else if (S.route === 'home') updateHomeFan();
  if (S.route === 'players') renderPlayerList();
}
SHEETS.auth = function(){
  const u = S.authUser;
  if (u) return { title: 'Account', html: '<div class="auth"><p>Signed in as <b>' + esc(u.email || '') + '</b>.</p><p class="hint">Your XI, leagues and predictions are saved to this account, so they follow you to any device.</p><button class="btn block" type="button" data-act="auth-out" id="auth-out">Sign out</button></div>' };
  const G_ICON = '<svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
  const cfgA = window.ML_SUPABASE || {}, useEmail = cfgA.emailLogin !== false;
  const gBlock = '<button class="btn block g-btn" type="button" data-act="auth-google" id="auth-google">' + G_ICON + 'Continue with Google</button><p class="hint" id="auth-gmsg" role="status" aria-live="polite"></p>';
  if (!useEmail) return { title: 'Sign in', focus: '#auth-google', html: '<div class="auth"><p>Sign in to save your XI online, create leagues and play friends.</p>' + gBlock + '<p class="hint">We only use your Google account to sign you in. Other players see your manager name, never your email.</p></div>' };
  return { title: 'Sign in', focus: '#auth-email', html: '<form class="auth" id="auth-form" novalidate><p>Sign in to save your XI online, create leagues and play friends.</p>' + gBlock + '<p class="or">or get a sign-in link by email</p><label for="auth-email">Email</label><input class="input" id="auth-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required><button class="btn primary block" type="submit" id="auth-send">Email me a sign-in link</button><p class="hint" id="auth-msg" role="status" aria-live="polite"></p><p class="hint">Open the link on this same device. Your email is only used to sign you in; other players see your manager name, never your email.</p></form>',
    bind(){ const f = $('#auth-form'); if (!f) return; f.addEventListener('submit', async e => { e.preventDefault();
      const em = $('#auth-email').value.trim(), msg = $('#auth-msg'), btn = $('#auth-send');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { msg.textContent = 'Enter a valid email address.'; return; }
      btn.disabled = true; btn.textContent = 'Sending…';
      try { const r = await S.sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.origin + location.pathname } });
        if (r.error) throw r.error; msg.innerHTML = '<b>Check your inbox.</b> We sent a sign-in link to ' + esc(em) + '. It can take a minute; check spam too.'; btn.textContent = 'Link sent';
      } catch (err) { const m = String(err && err.message || ''); msg.textContent = /not.?authori[sz]ed/i.test(m) || (err && err.code === 'email_address_not_authorized') ? 'Sign-up emails aren’t switched on for new players yet. Ask the league organiser to finish the email setup.' : /rate|limit|seconds/i.test(m) ? 'Too many sign-in emails right now. Wait a few minutes and try again.' : 'Couldn’t send the email: ' + m; btn.disabled = false; btn.textContent = 'Email me a sign-in link'; }
    }); } };
};

/* ================= multiplayer init ================= */
const withTimeout = (p, ms) => Promise.race([p, new Promise(res => setTimeout(() => res(null), ms))]);
async function initMode(){
  if (window.ML_SUPABASE) return initSupabase();
  let db = null, user = null, uid = null;
  try {
    const c = window.claude;
    if (c && typeof c.use === 'function') {
      [db, user] = await Promise.all([withTimeout(Promise.resolve(c.use('db')).catch(() => null), 8000), withTimeout(Promise.resolve(c.use('user')).catch(() => null), 8000)]);
      if (db && user && typeof user.id === 'function') uid = await withTimeout(Promise.resolve(user.id()).catch(() => null), 8000);
    }
  } catch (e) { db = null; }
  if (db && uid && typeof db.doc === 'function') {
    S.mode = 'mp'; S.db = db; S.user = user; S.uid = String(uid);
    try { const snap = await withTimeout(db.doc('entries/' + S.uid).get(), 10000); if (snap && snap.exists) S.saved = sanitizeEntry(typeof snap.data === 'function' ? snap.data() : snap.data); }
    catch (e) {}
  } else {
    S.mode = 'local'; S.saved = sanitizeEntry(store.get('ml.entry', null));
  }
  draftFromSaved();
  await loadLeagueNames().catch(() => {});
  refreshSaveState();
  if (S.route === 'fantasy') renderFantasy(); else if (S.route === 'home') updateHomeFan();
  if (S.route === 'players') renderPlayerList();
}

/* ================= boot ================= */
function renderChrome(){
  const m = D.meta, nx = nextMdFixtures();
  $('#hdr-meta').innerHTML = esc(m.season ? 'UCL ' + m.season : '') + (nx.md ? '<br><span style="color:var(--accent)">Next: MD' + nx.md + '</span>' : '');
  $('#nav-foot').textContent = 'Unofficial fan app. Data as of ' + fmtDate(m.asOf) + '.';
  $('#foot').innerHTML = '<p>Unofficial fan app · Not affiliated with UEFA · Data as of ' + esc(fmtDate(m.asOf)) + '</p>' + (m.sources.length ? '<ul aria-label="Sources">' + m.sources.map(s => '<li>' + (/^https?:\/\//i.test(s.url || '') ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + '</a>' : esc(s.name)) + '</li>').join('') + '</ul>' : '');
}
function start(raw){
  if (!raw || typeof raw !== 'object') {
    $('#view-home').innerHTML = '<div class="panel empty" style="margin-top:20px"><b>Match data didn’t load</b>Refresh the page to try again.</div>';
    $('#foot').innerHTML = '<p>Unofficial fan app · Not affiliated with UEFA</p>';
    return;
  }
  try { D = normalize(raw); } catch (e) { console.error(e); return start(null); }
  renderChrome();
  onHash();
  setInterval(() => { if (S.route === 'home' && !document.hidden) tickCountdown(); }, 1000);
  initMode();
}
if (window.UCL_DATA) start(window.UCL_DATA);
else {
  const s = document.createElement('script'); s.src = 'data.sample.js'; s.charset = 'utf-8';
  s.onload = () => start(window.UCL_DATA || null); s.onerror = () => start(null);
  (document.head || document.body || document.documentElement).appendChild(s);
}
})();
